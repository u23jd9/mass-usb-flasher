[package]
name = "mass-usb-flasher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "muf"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
sha2 = "0.10"
hex = "0.4"
bus_writer = "0.1.2"
crossbeam = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_UI_Shell",
] }

[build-dependencies]
winres = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"